    // --- Audio Synthesizer (Web Audio API) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }
      playClick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const now = this.ctx.currentTime;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(340 + Math.random() * 80, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.035);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      }
      playCoin(pitchMult = 1) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        const base = 987.77 * Math.min(2.2, pitchMult);
        osc.frequency.setValueAtTime(base, now);
        osc.frequency.setValueAtTime(base * 1.334, now + 0.07);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.setValueAtTime(0.18, now + 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.29);
      }
      playJackpot(level = 1) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const chord = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        chord.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const st = now + (idx * 0.035);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq * (1 + (level * 0.08)), st);
          gain.gain.setValueAtTime(0.12, st);
          gain.gain.exponentialRampToValueAtTime(0.001, st + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(st);
          osc.stop(st + 0.21);
        });
      }
      playDefuse() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }
      playCatastrophe() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.6);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.7);

        // Noise blast
        const bSize = this.ctx.sampleRate * 0.4;
        const buf = this.ctx.createBuffer(1, bSize, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.3, now);
        nGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        noise.connect(nGain);
        nGain.connect(this.ctx.destination);
        noise.start(now);
        noise.stop(now + 0.42);
      }
    }

    // --- Particles (Mario Coins, Floating Text, Sparks) ---
    class Particle {
      constructor(x, y, type, text = '', color = '#33ff33') {
        this.x = x;
        this.y = y;
        this.type = type;
        this.text = text;
        this.color = color;
        this.alpha = 1.0;
        this.life = 0;

        if (type === 'coin') {
          this.vx = (Math.random() - 0.5) * 5;
          this.vy = -7 - Math.random() * 4;
          this.gravity = 0.35;
          this.spin = 0;
          this.maxLife = 50;
        } else if (type === 'text') {
          this.vx = (Math.random() - 0.5) * 1.5;
          this.vy = -2.0 - Math.random() * 1.5;
          this.gravity = 0;
          this.maxLife = 60;
        } else if (type === 'spark') {
          const a = Math.random() * Math.PI * 2;
          const s = 2 + Math.random() * 5;
          this.vx = Math.cos(a) * s;
          this.vy = Math.sin(a) * s;
          this.gravity = 0.15;
          this.maxLife = 30;
        }
      }
      update() {
        this.life++;
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        if (this.type === 'coin') this.spin += 0.25;
        this.alpha = Math.max(0, 1 - (this.life / this.maxLife));
        return this.life < this.maxLife;
      }
      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        if (this.type === 'coin') {
          const w = Math.abs(Math.cos(this.spin)) * 14 + 3;
          ctx.translate(this.x, this.y);
          ctx.fillStyle = '#ffcc00';
          ctx.beginPath();
          ctx.ellipse(0, 0, w / 2, 9, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffe066';
          ctx.beginPath();
          ctx.ellipse(0, 0, Math.max(1, w / 2 - 2), 6, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#b38600';
          ctx.fillRect(-1, -3, 2, 6);
        } else if (this.type === 'text') {
          ctx.font = 'bold 15px Consolas, Courier, monospace';
          ctx.fillStyle = this.color;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 6;
          ctx.fillText(this.text, this.x, this.y);
        } else if (this.type === 'spark') {
          ctx.fillStyle = this.color;
          ctx.fillRect(this.x, this.y, 3, 3);
        }
        ctx.restore();
      }
    }

    // --- Lemmings Walking, Cascading & Farming Potatoes ---
    class Lemming {
      constructor(canvasWidth) {
        this.reset(canvasWidth, false);
      }
      reset(canvasWidth, isTitle = false) {
        this.x = isTitle ? (Math.random() * (canvasWidth - 160) + 80) : (Math.random() * (canvasWidth - 300) + 40);
        this.y = isTitle ? 618 : (55 + Math.random() * 20);
        this.vx = (Math.random() > 0.5 ? 1 : -1) * (0.7 + Math.random() * 0.6);
        this.vy = 0;
        this.onGround = isTitle;
        this.currentLineIndex = -1;
        this.onPrompt = false;
        this.anim = Math.floor(Math.random() * 100);
        this.color = ['#00ff66', '#00e5ff', '#ffea00', '#ff007f', '#b388ff'][Math.floor(Math.random() * 5)];

        // Potato Farming States: 'walk', 'dig', 'carry', 'celebrate'
        this.state = 'walk';
        this.farmTimer = 0;
        this.hasSack = false;
        this.dirtMound = 0;
      }
      kick() {
        if (this.onPrompt || this.y > 450) {
          this.onGround = false;
          this.onPrompt = false;
          this.currentLineIndex = -1;
          this.state = 'walk';
          this.farmTimer = 0;
          this.vy = -7.5 - Math.random() * 4.5;
          this.vx = (Math.random() - 0.5) * 6;
        }
      }
      update(canvasWidth, canvasHeight, terminalLines, promptY, screenShake, onHarvest, isTitle = false) {
        this.anim++;

        // Screen shake knocks them off & cancels digging
        if (screenShake > 4 && this.onGround && Math.random() < 0.2) {
          this.onGround = false;
          this.onPrompt = false;
          this.currentLineIndex = -1;
          this.state = 'walk';
          this.farmTimer = 0;
          this.vy = -2.5 - Math.random() * 3;
          this.vx = (Math.random() - 0.5) * 4;
        }

        // --- Title Screen Walking & Farming Ground ---
        if (isTitle) {
          this.y = 618;
          this.onGround = true;

          if (this.state === 'dig') {
            this.farmTimer--;
            this.dirtMound = Math.min(6, this.dirtMound + 0.1);
            if (this.farmTimer <= 0) {
              this.hasSack = true;
              this.state = 'carry';
              this.vx = (this.x > canvasWidth / 2) ? 0.9 : -0.9;
            }
            return true;
          } else if (this.state === 'celebrate') {
            this.farmTimer--;
            if (this.farmTimer <= 0) {
              this.state = 'walk';
            }
          } else if (this.state === 'carry') {
            this.x += this.vx;
            if ((this.vx > 0 && this.x > canvasWidth - 120) || (this.vx < 0 && this.x < 120)) {
              this.hasSack = false;
              this.state = 'celebrate';
              this.farmTimer = 35;
              this.vy = -3.5;
              this.vx = -this.vx;
              if (onHarvest) onHarvest(this.x, this.y);
            }
          } else {
            // 'walk' state
            this.x += this.vx;
            if (this.x < 60) { this.x = 60; this.vx = Math.abs(this.vx); }
            if (this.x > canvasWidth - 60) { this.x = canvasWidth - 60; this.vx = -Math.abs(this.vx); }

            if (!this.hasSack && Math.random() < 0.0035 && this.x > 140 && this.x < canvasWidth - 140) {
              this.state = 'dig';
              this.farmTimer = 65 + Math.floor(Math.random() * 35);
              this.dirtMound = 1;
            }
          }
          return true;
        }

        // --- Terminal Screen Walking & Farming Behavior ---
        const charW = 8.4;
        const lineBaseY = 75;
        const lineH = 22;

        if (this.onGround) {
          if (this.state === 'dig') {
            this.farmTimer--;
            this.dirtMound = Math.min(6, this.dirtMound + 0.1);
            if (this.farmTimer <= 0) {
              this.hasSack = true;
              this.state = 'carry';
              this.vx = (this.x > canvasWidth / 2) ? 0.9 : -0.9;
            }
            return true;
          } else if (this.state === 'celebrate') {
            this.farmTimer--;
            if (this.farmTimer <= 0) {
              this.state = 'walk';
            }
          } else if (this.state === 'carry') {
            if ((this.vx > 0 && this.x > canvasWidth - 190) || (this.vx < 0 && this.x < 60)) {
              this.hasSack = false;
              this.state = 'celebrate';
              this.farmTimer = 30;
              this.vy = -3.0;
              this.onGround = false;
              this.vx = -this.vx;
              if (onHarvest) onHarvest(this.x, this.y);
            }
          } else if (this.state === 'walk' && !this.hasSack) {
            if (Math.random() < 0.0035 && this.x > 80 && this.x < canvasWidth - 220) {
              this.state = 'dig';
              this.farmTimer = 60 + Math.floor(Math.random() * 30);
              this.dirtMound = 1;
              return true;
            }
          }
        }

        if (this.onGround) {
          if (this.onPrompt) {
            this.y = promptY - 34;
            this.x += this.vx;
            if (this.x < 30) { this.x = 30; this.vx = Math.abs(this.vx); }
            if (this.x > canvasWidth - 40) { this.x = canvasWidth - 40; this.vx = -Math.abs(this.vx); }
          } else if (this.currentLineIndex >= 0 && this.currentLineIndex < terminalLines.length) {
            const line = terminalLines[this.currentLineIndex];
            const endX = 30 + Math.min(780, (line ? line.text.length : 20) * charW);
            this.y = lineBaseY + (this.currentLineIndex * lineH) - 10;
            this.x += this.vx;

            if (this.x > endX) {
              this.onGround = false;
              this.vy = 0.5;
              this.vx = Math.abs(this.vx) * 0.8;
            } else if (this.x < 28) {
              this.x = 28;
              this.vx = Math.abs(this.vx);
            } else if (Math.random() < 0.003) {
              this.onGround = false;
              this.vy = 0.8;
            }
          } else {
            this.onGround = false;
          }
        }

        if (!this.onGround) {
          this.vy += 0.28;
          this.x += this.vx * 0.85;
          this.y += this.vy;

          if (this.vy > 0) {
            for (let i = 0; i < terminalLines.length; i++) {
              const targetY = lineBaseY + (i * lineH) - 10;
              if (this.y >= targetY - 6 && this.y <= targetY + 6) {
                const line = terminalLines[i];
                const endX = 30 + Math.min(780, (line ? line.text.length : 20) * charW);
                if (this.x >= 26 && this.x <= endX) {
                  this.onGround = true;
                  this.currentLineIndex = i;
                  this.onPrompt = false;
                  this.y = targetY;
                  this.vy = 0;
                  break;
                }
              }
            }

            const promptTop = promptY - 34;
            if (!this.onGround && this.y >= promptTop - 6 && this.y <= promptTop + 8) {
              if (this.x >= 20 && this.x <= canvasWidth - 30) {
                this.onGround = true;
                this.onPrompt = true;
                this.currentLineIndex = -1;
                this.y = promptTop;
                this.vy = 0;
              }
            }
          }
        }

        if (this.x < 20) { this.x = 20; this.vx = Math.abs(this.vx); }
        if (this.x > canvasWidth - 30) { this.x = canvasWidth - 30; this.vx = -Math.abs(this.vx); }

        return this.y < canvasHeight - 20;
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(Math.round(this.x), Math.round(this.y));

        // Digging patch animation
        if (this.state === 'dig') {
          // Soil mound
          ctx.fillStyle = '#6d4c41';
          ctx.beginPath();
          ctx.ellipse(5, 12, 8, 3, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#3e2723';
          ctx.fillRect(2, 11, 2, 2);
          ctx.fillRect(7, 12, 2, 2);

          // Flying dirt particles
          const digAnim = (this.anim % 8);
          if (digAnim < 4) {
            ctx.fillStyle = '#8d6e63';
            ctx.fillRect(-2 - digAnim * 2, 6 - digAnim * 2, 2, 2);
            ctx.fillRect(11 + digAnim * 2, 5 - digAnim * 2, 2, 2);
          }

          // Shovel swing
          const swing = Math.sin(this.anim * 0.45);
          ctx.strokeStyle = '#d7ccc8';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(4, 7);
          ctx.lineTo(8 + swing * 4, 12 + swing * 2);
          ctx.stroke();

          // Potato peeking out when almost done digging
          if (this.farmTimer < 25) {
            ctx.fillStyle = '#ffb300';
            ctx.beginPath();
            ctx.ellipse(5, 10 - (25 - this.farmTimer) * 0.25, 3, 2, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Classic Lemming body
        ctx.fillStyle = '#00ff66';
        ctx.fillRect(2, 0, 6, 3);
        ctx.fillStyle = '#ffe0b2';
        ctx.fillRect(3, 3, 5, 3);
        ctx.fillStyle = '#000';
        ctx.fillRect(this.vx > 0 ? 6 : 3, 4, 2, 2);
        ctx.fillStyle = this.color;
        ctx.fillRect(2, 6, 6, 4);

        // Burlap Potato Sack on back
        if (this.hasSack) {
          const sackX = this.vx > 0 ? -4 : 8;
          ctx.fillStyle = '#8d6e63';
          ctx.beginPath();
          ctx.ellipse(sackX + 2, 8, 4, 5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#5d4037';
          ctx.lineWidth = 1;
          ctx.stroke();

          // Knot and golden potato top
          ctx.fillStyle = '#ffb300';
          ctx.fillRect(sackX + 1, 3, 2, 2);
          ctx.fillStyle = '#ffca28';
          ctx.fillRect(sackX + 1, 4, 3, 2);
        }

        // Legs
        ctx.fillStyle = '#3f51b5';
        if (this.onGround && this.state !== 'dig') {
          const leg = Math.sin(this.anim * 0.45);
          ctx.fillRect(2, 10, 2, 3 + leg);
          ctx.fillRect(6, 10, 2, 3 - leg);
        } else {
          ctx.fillRect(1, 10, 3, 4);
          ctx.fillRect(6, 10, 3, 4);
        }
        ctx.restore();
      }
    }

          let w = maxW;
          let h = w / aspect;
          if (h > maxH) {
            h = maxH;
            w = h * aspect;
          }

          this.canvas.style.width = Math.floor(w) + 'px';
          this.canvas.style.height = Math.floor(h) + 'px';

          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          this.canvas.width = Math.floor(1000 * dpr);
          this.canvas.height = Math.floor(680 * dpr);
          this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      setupLemmings(count = 6) {
        this.lemmings = [];
        const isTitle = (this.viewMode === 'title');
        for (let i = 0; i < count; i++) {
          const lem = new Lemming(1000);
          lem.reset(1000, isTitle);
          this.lemmings.push(lem);
        }
      }

      updateLineYs() {
        this.lineYs = [];
        const startY = 85;
        const lineH = 22;
        for (let i = 0; i < this.terminalLines.length + 2; i++) {
          this.lineYs.push(startY + (i * lineH));
        }
      }

      formatHUID(date) {
        const Y = date.getFullYear();
        const M = String(date.getMonth() + 1).padStart(2, '0');
        const D = String(date.getDate()).padStart(2, '0');
        const h = String(date.getHours()).padStart(2, '0');
        const m = String(date.getMinutes()).padStart(2, '0');
        const s = String(date.getSeconds()).padStart(2, '0');
        return 'HUID_' + Y + M + D + '_' + h + m + s;
      }

      setAvatarQuote(quote, mode = 'normal', duration = 100) {
        this.avatarQuote = quote;
        this.avatarMode = mode;
        this.quoteTimer = duration;
      }

      nextPrompt() {
        this.isTrap = Math.random() < 0.22;
        if (this.isTrap) {
          const txt = TRAP_TASKS[Math.floor(Math.random() * TRAP_TASKS.length)];
          this.currentPrompt = { text: txt, trap: true };
          if (Math.random() < 0.4) {
            this.setAvatarQuote("Wait... do NOT approve that!", "clown", 90);
          }
        } else {
          const txt = SAFE_TASKS[Math.floor(Math.random() * SAFE_TASKS.length)];
          this.currentPrompt = { text: txt, trap: false };
        }
      }

      appendTerminalLine(text, color = '#33ff33') {
        this.terminalLines.push({ text, color });
        if (this.terminalLines.length > this.maxTerminalLines) {
          this.terminalLines.shift();
        }
      }

      spawnCoins(count = 3, originX = 400, originY = 560) {
        for (let i = 0; i < count; i++) {
          this.particles.push(new Particle(originX, originY, 'coin'));
        }
      }

      spawnText(text, x, y, color = '#ffea00') {
        this.particles.push(new Particle(x, y, 'text', text, color));
      }

      spawnSparks(count = 12, x = 400, y = 560, color = '#00ff66') {
        for (let i = 0; i < count; i++) {
          this.particles.push(new Particle(x, y, 'spark', '', color));
        }
      }

      triggerCatastrophicReset() {
        this.sound.playCatastrophe();
        this.flashRed = 35;
        this.screenShake = 22;

        const lostScore = this.score;
        // Auto-preserve high-scoring runs into the Hall of Fame before zeroing out!
        if (this.score > 0) {
          this.saveScoreToLeaderboard(true);
        }

        this.score = 0;
        this.multiplier = 1.0;
        this.pointVelocity = 1.0;
        this.consecutiveSecs = 0;

        this.setAvatarQuote("BLYAT! SCORE IS ZERO!", "clown", 160);

        this.appendTerminalLine('tsoding@collider:~$ ' + this.currentPrompt.text + ' [y/N]? y', '#ff3344');
        this.appendTerminalLine('[CATASTROPHE] You accepted forbidden trap! Score reset to 0! (-' + lostScore + ')', '#ff2244');
        this.appendTerminalLine('[FATAL] BLYAT! Core dumped. Run saved to Top 10.', '#ff6666');

        this.spawnText('SCORE WIPED! 0', 350, 520, '#ff1111');
        this.nextPrompt();
      }

      handleYesAction() {
        if (this.viewMode === 'hall_of_fame') {
          this.viewMode = 'terminal';
          return;
        }

        const now = new Date();
        const curSec = now.getSeconds();

        // Trampoline kick lemmings walking near prompt!
        for (const lem of this.lemmings) {
          lem.kick();
        }

        // TRAP CHECK
        if (this.currentPrompt && this.currentPrompt.trap) {
          this.triggerCatastrophicReset();
          return;
        }

        const promptText = this.currentPrompt ? this.currentPrompt.text : 'da_append(&da, item);';

        if (curSec === this.lastSec) {
          // COLLISION!
          this.collisionsThisSec++;
          this.totalCollisions++;
          if (this.collisionsThisSec > this.peakCollisions) {
            this.peakCollisions = this.collisionsThisSec;
          }

          const base = 50 * Math.pow(1.8, Math.min(this.collisionsThisSec - 1, 6));
          const earned = Math.round(base * this.multiplier);
          this.score += earned;
          this.pointVelocity = Math.min(25.0, this.pointVelocity + 0.7);

          const pitch = 1 + (this.collisionsThisSec * 0.15);
          this.sound.playCoin(pitch);
          if (this.collisionsThisSec >= 4) {
            this.sound.playJackpot(Math.min(5, this.collisionsThisSec));
          }

          this.screenShake = Math.min(18, 3 + this.collisionsThisSec * 1.5);
          this.spawnCoins(Math.min(5, 1 + Math.floor(this.collisionsThisSec / 2)), 420, 560);
          this.spawnSparks(12, 420, 560, '#00ff66');
          this.spawnText('💥 COLLISION #' + this.collisionsThisSec + '! +' + earned, 350, 530, '#ffea00');

          if (this.collisionsThisSec === 2) {
            this.setAvatarQuote("Collision detected!", "smile", 60);
          } else if (this.collisionsThisSec === 4) {
            this.setAvatarQuote("KEEP MASHING BLYAT!", "shades", 90);
          } else if (this.collisionsThisSec >= 7) {
            this.setAvatarQuote("SPEED OF LIGHT!", "laser", 120);
          }

          this.appendTerminalLine('tsoding@collider:~$ ' + promptText + ' [y/N]? y', '#00ff66');
          this.appendTerminalLine('--> [💥 COLLISION #' + this.collisionsThisSec + '] ' + this.currentHuidStr + ' (+' + earned + ' pts)', '#ffea00');
        } else {
          // First approval in new second
          this.lastSec = curSec;
          this.collisionsThisSec = 1;

          const earned = Math.round(15 * this.multiplier);
          this.score += earned;
          this.sound.playClick();
          this.spawnSparks(5, 420, 560, '#00e5ff');
          this.spawnText('CREATED +' + earned, 380, 540, '#00ff66');

          if (this.consecutiveSecs >= 3 && this.avatarMode === 'normal') {
            this.setAvatarQuote("NO BLOAT! PURE SPEED!", "smile", 60);
          }

          this.appendTerminalLine('tsoding@collider:~$ ' + promptText + ' [y/N]? y', '#00ff66');
          this.appendTerminalLine('--> [CREATED] ' + this.currentHuidStr + ' (+' + earned + ' pts)', '#33ff55');
        }

        if (this.score > this.highScore) {
          this.highScore = this.score;
          localStorage.setItem('huid_high_score', String(this.highScore));
          if (this.avatarMode !== 'laser' && this.avatarMode !== 'shades') {
            this.setAvatarQuote("NEW HIGH SCORE!", "crown", 80);
          }
        }

        this.nextPrompt();
      }

      handleNoAction() {
        if (this.viewMode === 'hall_of_fame') {
          this.viewMode = 'terminal';
          return;
        }

        const promptText = this.currentPrompt ? this.currentPrompt.text : '';

        if (this.currentPrompt && this.currentPrompt.trap) {
          // Defused!
          const bonus = Math.round(250 * this.multiplier);
          this.score += bonus;
          this.sound.playDefuse();
          this.sound.playJackpot(2);
          this.spawnSparks(16, 420, 560, '#00e5ff');
          this.spawnText('🛡️ TRAP DEFUSED! +' + bonus, 340, 530, '#00e5ff');
          this.setAvatarQuote("Good reject! No bloat here.", "smug", 80);

          this.appendTerminalLine('tsoding@collider:~$ ' + promptText + ' [y/N]? n', '#ff3344');
          this.appendTerminalLine('--> [🛡️ DEFUSED] Rejected trap! (+' + bonus + ' pts)', '#00e5ff');
        } else {
          this.sound.playClick();
          this.appendTerminalLine('tsoding@collider:~$ ' + promptText + ' [y/N]? n', '#666666');
          this.appendTerminalLine('--> [SKIPPED] Task deferred.', '#555555');
        }

        this.nextPrompt();
      }

      saveScoreToLeaderboard(wiped = false) {
        if (this.score <= 0) return;
        const entry = {
          score: this.score,
          collisions: this.totalCollisions,
          peakRate: this.peakCollisions,
          multiplier: this.multiplier.toFixed(1),
          date: new Date().toISOString().replace('T', ' ').slice(0, 19),
          status: wiped ? '☠️ WIPED' : '⚡ RECORD'
        };

        const duplicate = this.scoresList.find(e => e.score === entry.score && Math.abs(new Date(e.date) - new Date(entry.date)) < 4000);
        if (!duplicate) {
          this.scoresList.push(entry);
          this.scoresList.sort((a, b) => b.score - a.score);
          this.scoresList = this.scoresList.slice(0, 10);
          localStorage.setItem('huid_leaderboard', JSON.stringify(this.scoresList));
        }
      }

      toggleHallOfFame() {
        if (this.viewMode === 'hall_of_fame') {
          this.viewMode = this.previousViewMode || 'title';
        } else {
          this.previousViewMode = this.viewMode;
          this.viewMode = 'hall_of_fame';
          if (this.score > 0) {
            this.saveScoreToLeaderboard(false);
          }
        }
      }

      startGame() {
        this.viewMode = 'terminal';
        this.score = 0;
        this.collisionsThisSec = 0;
        this.multiplier = 1.0;
        this.pointVelocity = 1.0;
        this.consecutiveSecs = 0;
        this.lastSec = -1;
        this.terminalLines = [
          { text: "Linux tsoding-box 6.8.0-huid x86_64 GNU/Linux", color: "#888888" },
          { text: "TATR: Potato Farming Simulator - Collider v2.0 initialized.", color: "#888888" },
          { text: "✦ HUID collisions abound ✦", color: "#00e5ff" },
          { text: "Type [Y] to approve creation & generate high-velocity collisions.", color: "#00e5ff" },
          { text: "WARNING: Watch out for [TRAP] lines. Reject them with [N]!", color: "#ffea00" },
          { text: "----------------------------------------------------------------------", color: "#336633" }
        ];
        this.nextPrompt();
        this.setAvatarQuote("Harvest initiated! da_append(&da, item);", "normal", 90);
        this.sound.playJackpot(2);
        this.setupLemmings(6);
      }

      returnToTitle() {
        if (this.score > 0) {
          this.saveScoreToLeaderboard(false);
        }
        this.viewMode = 'title';
        this.isPaused = false;
        this.setAvatarQuote("Welcome back to TATR! Ready to harvest?", "smile", 120);
        this.setupLemmings(6);
      }

      handlePotatoHarvest(x, y) {
        this.potatoesHarvested++;
        localStorage.setItem('tatr_potatoes', String(this.potatoesHarvested));
        const bonus = Math.round(50 * this.multiplier);
        this.score += bonus;
        if (this.score > this.highScore) {
          this.highScore = this.score;
          localStorage.setItem('huid_high_score', String(this.highScore));
        }
        this.spawnText('🥔 +1 POTATO! (+' + bonus + ')', x - 30, y - 25, '#ffca28');
        this.sound.playCoin(1.8);
        this.spawnSparks(12, x, y, '#ffb300');
        if (Math.random() < 0.25) {
          this.setAvatarQuote("Fresh potato harvested!", "smug", 70);
        }
      }

      copyBragToClipboard() {
        const text = '🏆 I scored ' + this.score.toLocaleString() + ' points with ' + this.peakCollisions + ' collisions/sec in TATR: Potato Farming Simulator! Can you beat my Tsoding collider?';
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
          this.spawnText('COPIED TO CLIPBOARD!', 420, 320, '#00e5ff');
        }
      }

      togglePause() {
        this.isPaused = !this.isPaused;
        if (this.isPaused) {
          this.setAvatarQuote("Game paused. Sipping tea...", "cup", 999999);
        } else {
          this.setAvatarQuote("Resumed! da_append(&da, item);", "normal", 80);
        }
      }

      setupEventListeners() {
        window.addEventListener('beforeunload', () => {
          if (this.score > 0) this.saveScoreToLeaderboard(false);
        });

        window.addEventListener('keydown', (e) => {
          this.sound.init();

          // If paused, ANY key press unpauses the game immediately
          if (this.isPaused) {
            e.preventDefault();
            this.isPaused = false;
            this.setAvatarQuote("Resumed! da_append(&da, item);", "normal", 80);
            return;
          }

          // In Hall of Fame view, key presses return back
          if (this.viewMode === 'hall_of_fame') {
            if (e.key === 'c' || e.key === 'C') {
              this.copyBragToClipboard();
            } else if (e.key === 'h' || e.key === 'H' || e.key === 'Tab' || e.key === 'Escape' || e.key === ' ' || e.key === 'Enter') {
              e.preventDefault();
              this.toggleHallOfFame();
            }
            return;
          }

          if (e.key === 't' || e.key === 'T') {
            e.preventDefault();
            if (this.score > 0) this.saveScoreToLeaderboard(false);
            window.location.href = 'terrarium.html';
            return;
          }

          // In Title view
          if (this.viewMode === 'title') {
            if (e.key === ' ' || e.key === 'Enter' || e.key === 'y' || e.key === 'Y') {
              e.preventDefault();
              this.startGame();
              return;
            } else if (e.key === 'h' || e.key === 'H' || e.key === 'Tab') {
              e.preventDefault();
              this.toggleHallOfFame();
              return;
            } else if (e.key === 'm' || e.key === 'M') {
              this.sound.toggleMute();
              return;
            }
          }

          // In Active Terminal Gameplay
          if (e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            this.togglePause();
            return;
          }

          if (e.key === 'q' || e.key === 'Q') {
            e.preventDefault();
            this.returnToTitle();
            return;
          }

          if (e.key === 'y' || e.key === 'Y' || e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            this.handleYesAction();
          } else if (e.key === 'n' || e.key === 'N' || e.key === 'Backspace' || e.key === 'Escape') {
            e.preventDefault();
            this.handleNoAction();
          } else if (e.key === 'm' || e.key === 'M') {
            this.sound.toggleMute();
          } else if (e.key === 'h' || e.key === 'H' || e.key === 'Tab') {
            e.preventDefault();
            this.toggleHallOfFame();
          } else if (e.key === 'c' || e.key === 'C') {
            this.copyBragToClipboard();
          }
        });

        const handlePointer = (clientX, clientY) => {
          this.sound.init();

          // If paused, ANY click or tap unpauses immediately
          if (this.isPaused) {
            this.isPaused = false;
            this.setAvatarQuote("Resumed! da_append(&da, item);", "normal", 80);
            return;
          }

          const rect = this.canvas.getBoundingClientRect();
          const scaleX = 1000 / rect.width;
          const scaleY = 680 / rect.height;
          const x = (clientX - rect.left) * scaleX;
          const y = (clientY - rect.top) * scaleY;

          // Check cyber buttons row
          for (const btn of this.buttons) {
            if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
              if (btn.id === 'btn_yes') {
                if (this.viewMode === 'title') this.startGame();
                else this.handleYesAction();
              }
              else if (btn.id === 'btn_no') this.handleNoAction();
              else if (btn.id === 'btn_pause') this.togglePause();
              else if (btn.id === 'btn_hof') this.toggleHallOfFame();
              else if (btn.id === 'btn_title') {
                if (this.viewMode === 'terminal') this.returnToTitle();
                else if (this.viewMode === 'hall_of_fame') this.toggleHallOfFame();
              }
              else if (btn.id === 'btn_mute') this.sound.toggleMute();
              else if (btn.id === 'btn_farm') {
                if (this.score > 0) this.saveScoreToLeaderboard(false);
                window.location.href = 'terrarium.html';
              }
              return;
            }
          }

          if (this.viewMode === 'hall_of_fame') {
            if (y > 520) this.copyBragToClipboard();
            else this.toggleHallOfFame();
            return;
          }

          if (this.viewMode === 'title') {
            // Clicking the left or right Potato Silo Hatches dives into terrarium.html!
            if (y >= 540 && y < 630 && (x <= 205 || x >= 795)) {
              window.location.href = 'terrarium.html';
              return;
            }
            // Clicking anywhere else above buttons starts the game
            if (y < 630) {
              this.startGame();
            }
            return;
          }

          if (y < 610) {
            this.handleYesAction();
          }
        };

        this.canvas.addEventListener('mousedown', (e) => handlePointer(e.clientX, e.clientY));
        this.canvas.addEventListener('touchstart', (e) => {
          if (e.touches.length > 0) {
            handlePointer(e.touches[0].clientX, e.touches[0].clientY);
          }
        }, { passive: true });
      }

      update(dt) {
        this.titleAnim++;
        if (this.isPaused) return;

        const now = new Date();
        this.currentHuidStr = this.formatHUID(now);
        this.activeSecondMs = now.getMilliseconds();

        const curSec = now.getSeconds();
        if (this.lastSec !== -1 && curSec !== this.lastSec) {
          if (this.collisionsThisSec >= 2) {
            this.consecutiveSecs++;
            this.multiplier = Math.min(10.0, 1.0 + (this.consecutiveSecs * 0.45));
          } else {
            this.consecutiveSecs = Math.max(0, this.consecutiveSecs - 1);
            this.multiplier = Math.max(1.0, this.multiplier - 0.25);
          }
          this.collisionsThisSec = 0;
          this.lastSec = curSec;
        }

        this.pointVelocity = Math.max(1.0, this.pointVelocity - (dt * 0.8));

        if (this.screenShake > 0) {
          this.screenShake *= 0.88;
          if (this.screenShake < 0.2) this.screenShake = 0;
        }
        if (this.flashRed > 0) this.flashRed--;

        if (this.quoteTimer > 0) {
          this.quoteTimer--;
          if (this.quoteTimer === 0) {
            this.avatarQuote = 'da_append(&da, item);';
            this.avatarMode = 'normal';
          }
        }

        const isTitle = (this.viewMode === 'title');
        for (const lem of this.lemmings) {
          const alive = lem.update(1000, 680, isTitle ? [] : this.terminalLines, isTitle ? 618 : 575, this.screenShake, (x, y) => this.handlePotatoHarvest(x, y), isTitle);
          if (!alive) {
            this.spawnSparks(8, lem.x, isTitle ? 618 : 600, '#00ff66');
            lem.reset(1000, isTitle);
          }
        }

        this.particles = this.particles.filter(p => {
          p.update();
          return p.alpha > 0;
        });

        this.promptBlink = (this.promptBlink + 1) % 40;
      }

      draw() {
        const ctx = this.ctx;
        ctx.save();

        if (this.screenShake > 0) {
          const sx = (Math.random() - 0.5) * this.screenShake * 2;
          const sy = (Math.random() - 0.5) * this.screenShake * 2;
          ctx.translate(sx, sy);
        }

        ctx.fillStyle = this.flashRed > 0 ? '#260404' : '#030803';
        ctx.fillRect(0, 0, 1000, 680);

        this.drawScanlines(ctx);
        this.drawStatusBar(ctx);

        if (this.viewMode === 'title') {
          this.drawTitleScreen(ctx);
          for (const lem of this.lemmings) lem.draw(ctx);
          for (const p of this.particles) p.draw(ctx);
          this.drawButtons(ctx);
        } else if (this.viewMode === 'terminal') {
          this.drawTerminalBuffer(ctx);
          this.drawActivePrompt(ctx);
          this.drawTsodingCam(ctx);
          for (const lem of this.lemmings) lem.draw(ctx);
          for (const p of this.particles) p.draw(ctx);
          this.drawButtons(ctx);
          if (this.isPaused) {
            this.drawPauseOverlay(ctx);
          }
        } else {
          this.drawHallOfFame(ctx);
        }

        ctx.restore();
      }

      drawStatusBar(ctx) {
        ctx.fillStyle = '#071607';
        ctx.fillRect(15, 10, 970, 36);
        ctx.strokeStyle = '#1b7a2b';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(15, 10, 970, 36);

        ctx.font = 'bold 13px Consolas, Courier, monospace';

        ctx.fillStyle = '#ffea00';
        ctx.fillText('[' + this.currentHuidStr + ']', 25, 33);

        ctx.fillStyle = '#33ff55';
        ctx.fillText('SCORE:', 230, 33);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(this.score.toLocaleString(), 280, 33);

        ctx.fillStyle = '#88ff88';
        ctx.fillText('HIGH: ' + this.highScore.toLocaleString(), 370, 33);

        ctx.fillStyle = '#ffca28';
        ctx.fillText('🥔 ' + this.potatoesHarvested, 475, 33);

        ctx.fillStyle = '#ffea00';
        ctx.fillText('MULT: ' + this.multiplier.toFixed(1) + 'x', 545, 33);

        const velW = Math.min(1.0, this.pointVelocity / 15) * 50;
        ctx.fillStyle = '#00ff66';
        ctx.fillRect(630, 23, velW, 10);
        ctx.strokeStyle = '#228833';
        ctx.strokeRect(630, 23, 50, 10);

        ctx.fillStyle = '#00e5ff';
        ctx.fillText('COLL/S: ' + this.collisionsThisSec, 695, 33);

        const secW = (this.activeSecondMs / 1000) * 85;
        ctx.fillStyle = '#112911';
        ctx.fillRect(775, 23, 85, 12);
        ctx.fillStyle = (this.activeSecondMs > 800) ? '#ff3344' : '#00ff66';
        ctx.fillRect(775, 23, secW, 12);
        ctx.strokeStyle = '#227722';
        ctx.strokeRect(775, 23, 85, 12);

        ctx.fillStyle = '#888888';
        ctx.font = '11px Consolas, Courier, monospace';
        ctx.fillText(this.activeSecondMs + 'ms', 870, 32);

        ctx.fillStyle = (this.viewMode === 'title') ? '#ffb300' : '#00ff66';
        ctx.font = 'bold 11px Consolas, Courier, monospace';
        ctx.fillText((this.viewMode === 'title') ? '[TATR_IDLE]' : '[LIVE]', 920, 32);
      }

      drawTerminalBuffer(ctx) {
        ctx.save();
        // Strict clipping boundary: prevents text from bleeding into status bar, webcam, or active prompt
        ctx.beginPath();
        ctx.rect(20, 52, 820, 473);
        ctx.clip();

        ctx.font = '14px Consolas, Courier, monospace';
        let y = 75;
        const lineH = 22;

        for (const item of this.terminalLines) {
          ctx.fillStyle = item.color || '#33ff33';
          ctx.fillText(item.text, 30, y);
          y += lineH;
        }
        ctx.restore();
      }

      drawActivePrompt(ctx) {
        const promptY = 575;
        const promptH = 34;

        if (this.isTrap) {
          // VIVID RED ALERT FOR TRAP
          ctx.fillStyle = 'rgba(255, 30, 60, 0.22)';
          ctx.fillRect(20, promptY - 24, 960, promptH);
          ctx.strokeStyle = '#ff2244';
          ctx.lineWidth = 2;
          ctx.strokeRect(20, promptY - 24, 960, promptH);

          ctx.font = 'bold 12px Consolas, Courier, monospace';
          ctx.fillStyle = '#ff2244';
          ctx.fillText('[ ⚠️ HAZARD TRAP! PRESS [N] TO REJECT ⚠️ ]', 30, promptY - 30);

          ctx.font = 'bold 15px Consolas, Courier, monospace';
          ctx.fillStyle = '#ff4455';
          const txt = 'tsoding@collider:~$ ' + (this.currentPrompt ? this.currentPrompt.text : '');
          ctx.fillText(txt, 30, promptY - 2);

          if (this.promptBlink < 20) {
            const w = ctx.measureText(txt).width;
            ctx.fillStyle = '#ff2244';
            ctx.fillRect(32 + w, promptY - 16, 10, 16);
          }
        } else {
          // BRIGHT PHOSPHOR GREEN FOR SAFE TASK
          ctx.fillStyle = 'rgba(0, 255, 80, 0.08)';
          ctx.fillRect(20, promptY - 24, 960, promptH);
          ctx.strokeStyle = '#00ff66';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(20, promptY - 24, 960, promptH);

          ctx.font = 'bold 12px Consolas, Courier, monospace';
          ctx.fillStyle = '#00ff66';
          ctx.fillText('[ SAFE PROMPT: MASH [Y] FAST FOR HUID COLLISIONS! ]', 30, promptY - 30);

          ctx.font = 'bold 15px Consolas, Courier, monospace';
          ctx.fillStyle = '#33ff77';
          const txt = 'tsoding@collider:~$ ' + (this.currentPrompt ? this.currentPrompt.text : '') + ' [y/N]?';
          ctx.fillText(txt, 30, promptY - 2);

          if (this.promptBlink < 20) {
            const w = ctx.measureText(txt).width;
            ctx.fillStyle = '#00ff66';
            ctx.fillRect(32 + w, promptY - 16, 10, 16);
          }
        }
      }

      drawPauseOverlay(ctx) {
        ctx.save();
        // Dimmed cyber terminal overlay
        ctx.fillStyle = 'rgba(2, 8, 4, 0.78)';
        ctx.fillRect(20, 52, 820, 574);

        // Center pause cyber modal box
        const boxX = 210;
        const boxY = 240;
        const boxW = 440;
        const boxH = 150;

        ctx.fillStyle = '#051108';
        ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 2;
        ctx.strokeRect(boxX, boxY, boxW, boxH);

        // Corner accents
        ctx.fillStyle = '#00e5ff';
        ctx.fillRect(boxX - 3, boxY - 3, 6, 6);
        ctx.fillRect(boxX + boxW - 3, boxY - 3, 6, 6);
        ctx.fillRect(boxX - 3, boxY + boxH - 3, 6, 6);
        ctx.fillRect(boxX + boxW - 3, boxY + boxH - 3, 6, 6);

        // Text
        ctx.textAlign = 'center';
        ctx.font = 'bold 22px Consolas, Courier, monospace';
        ctx.fillStyle = '#00e5ff';
        ctx.fillText('⏸️ GAME PAUSED', boxX + boxW / 2, boxY + 45);

        ctx.font = 'bold 14px Consolas, Courier, monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('PRESS ANY KEY OR TAP TO RESUME', boxX + boxW / 2, boxY + 85);

        ctx.font = '12px Consolas, Courier, monospace';
        ctx.fillStyle = '#88aaaa';
        ctx.fillText('Hotkeys: [ P ] or [ Y ] or [ Space ]', boxX + boxW / 2, boxY + 118);

        ctx.restore();
      }

      drawTsodingCam(ctx) {
        const camX = 850;
        const camY = 60;
        const camSize = 90;

        ctx.save();
        ctx.fillStyle = '#051105';
        ctx.fillRect(camX, camY, camSize, camSize);

        let borderCol = '#00ff66';
        let badgeTxt = '● REC';
        let badgeCol = '#00ff66';
        let img = this.avatarImg;

        if (this.isPaused) {
          borderCol = '#00e5ff';
          badgeTxt = '● PAUSED';
          badgeCol = '#00e5ff';
          img = this.cupImg;
        } else if (this.avatarMode === 'clown') {
          borderCol = '#ff2244';
          badgeTxt = '● BLYAT';
          badgeCol = '#ff2244';
          img = this.clownImg;
        } else if (this.avatarMode === 'pog' || this.avatarMode === 'laser' || this.avatarMode === 'shades') {
          borderCol = '#ffea00';
          badgeTxt = '● TSODINPOG';
          badgeCol = '#ffea00';
          img = this.pogImg;
        } else if (this.avatarMode === 'smile' || this.avatarMode === 'smug' || this.avatarMode === 'crown') {
          borderCol = '#00ff66';
          badgeTxt = '● TSODINW';
          badgeCol = '#00ff66';
          img = this.wImg;
        }

        ctx.strokeStyle = borderCol;
        ctx.lineWidth = 2;
        ctx.strokeRect(camX, camY, camSize, camSize);

        if (img && img.complete && img.naturalWidth > 0) {
          ctx.drawImage(img, camX + 2, camY + 2, camSize - 4, camSize - 4);
        }

        // Camera mode status text badge
        ctx.fillStyle = badgeCol;
        ctx.font = 'bold 10px Consolas, Courier, monospace';
        ctx.fillText(badgeTxt, camX + 8, camY + 14);

        // Speech bubble
        const quote = this.isPaused ? 'Paused. Tea time...' : this.avatarQuote;
        if (quote) {
          ctx.font = 'bold 12px Consolas, Courier, monospace';
          const tw = ctx.measureText(quote).width;
          const bubbleX = camX - tw - 24;
          const bubbleY = camY + 25;

          ctx.fillStyle = '#061606';
          ctx.strokeStyle = borderCol;
          ctx.lineWidth = 1.5;
          ctx.fillRect(bubbleX, bubbleY - 16, tw + 16, 26);
          ctx.strokeRect(bubbleX, bubbleY - 16, tw + 16, 26);

          ctx.fillStyle = (this.avatarMode === 'clown' && !this.isPaused) ? '#ff4444' : (this.isPaused ? '#00e5ff' : '#33ff77');
          ctx.fillText(quote, bubbleX + 8, bubbleY + 2);
        }
        ctx.restore();
      }

      drawTitleScreen(ctx) {
        ctx.save();

        // 80s Synthwave Perspective Grid Background
        const gridGrad = ctx.createLinearGradient(0, 360, 0, 640);
        gridGrad.addColorStop(0, '#100326');
        gridGrad.addColorStop(0.5, '#240645');
        gridGrad.addColorStop(1, '#050110');
        ctx.fillStyle = gridGrad;
        ctx.fillRect(0, 380, 1000, 255);

        // Grid horizontal lines receding into distance
        ctx.strokeStyle = 'rgba(255, 0, 128, 0.35)';
        ctx.lineWidth = 1;
        const horizonY = 390;
        for (let i = 1; i <= 9; i++) {
          const lineY = horizonY + Math.pow(i / 9, 2.2) * 235;
          ctx.beginPath();
          ctx.moveTo(0, lineY);
          ctx.lineTo(1000, lineY);
          ctx.stroke();
        }

        // Perspective vertical lines
        const vanishingX = 500;
        const vanishingY = horizonY - 10;
        for (let vx = -200; vx <= 1200; vx += 70) {
          ctx.beginPath();
          ctx.moveTo(vanishingX, vanishingY);
          ctx.lineTo(vx, 635);
          ctx.stroke();
        }

        // Neon Horizon Glow
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        ctx.lineTo(1000, horizonY);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Twinkling 80s Cyber Stars
        ctx.fillStyle = '#ffea00';
        for (let s = 0; s < 16; s++) {
          const sx = (s * 67 + 35) % 960 + 20;
          const sy = 55 + (s * 31) % 180;
          const starAlpha = 0.3 + 0.5 * Math.sin(this.titleAnim * 0.05 + s);
          ctx.globalAlpha = starAlpha;
          ctx.fillRect(sx, sy, 2, 2);
          if (s % 3 === 0) {
            ctx.fillRect(sx - 1, sy, 4, 2);
            ctx.fillRect(sx, sy - 1, 2, 4);
          }
        }
        ctx.globalAlpha = 1.0;

        // --- 80s RETRO POTATO LOGO ---
        const potCenterX = 500;
        const potCenterY = 128;

        // Potato Outer Neon Glow
        ctx.shadowColor = '#ffb300';
        ctx.shadowBlur = 24;

        // Organic Curved Potato Silhouette
        const potGrad = ctx.createRadialGradient(potCenterX - 20, potCenterY - 15, 10, potCenterX, potCenterY, 95);
        potGrad.addColorStop(0, '#ffe082');
        potGrad.addColorStop(0.35, '#ffb300');
        potGrad.addColorStop(0.7, '#e65100');
        potGrad.addColorStop(1, '#5d2600');

        ctx.fillStyle = potGrad;
        ctx.strokeStyle = '#ffe57f';
        ctx.lineWidth = 3.5;

        ctx.beginPath();
        ctx.moveTo(potCenterX - 95, potCenterY - 5);
        ctx.bezierCurveTo(potCenterX - 100, potCenterY - 55, potCenterX - 45, potCenterY - 70, potCenterX + 15, potCenterY - 65);
        ctx.bezierCurveTo(potCenterX + 85, potCenterY - 60, potCenterX + 115, potCenterY - 30, potCenterX + 105, potCenterY + 15);
        ctx.bezierCurveTo(potCenterX + 95, potCenterY + 60, potCenterX + 40, potCenterY + 70, potCenterX - 25, potCenterY + 65);
        ctx.bezierCurveTo(potCenterX - 85, potCenterY + 60, potCenterX - 92, potCenterY + 35, potCenterX - 95, potCenterY - 5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Potato Dimples / Eyes
        ctx.fillStyle = '#4e1d00';
        const spots = [
          [potCenterX - 55, potCenterY - 35, 4, 2.5],
          [potCenterX - 20, potCenterY - 45, 3, 2],
          [potCenterX + 50, potCenterY - 30, 4, 2.5],
          [potCenterX - 65, potCenterY + 25, 4, 2.5],
          [potCenterX + 25, potCenterY + 45, 3.5, 2],
          [potCenterX + 70, potCenterY + 20, 3, 2]
        ];
        for (const [sx, sy, rx, ry] of spots) {
          ctx.beginPath();
          ctx.ellipse(sx, sy, rx, ry, 0.25, 0, Math.PI * 2);
          ctx.fill();
        }

        // Cute Green Sprout on top
        ctx.fillStyle = '#00ff66';
        ctx.beginPath();
        ctx.ellipse(potCenterX + 8, potCenterY - 68, 5, 12, -0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(potCenterX + 20, potCenterY - 65, 4, 10, 0.45, 0, Math.PI * 2);
        ctx.fill();

        // --- 80s CHROME "TATR" TITLE ---
        ctx.font = '900 66px "Impact", "Arial Black", Consolas, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // 80s Synthwave Dual Extrusion Shadows
        ctx.fillStyle = '#ff007f';
        ctx.fillText('TATR', potCenterX + 3, potCenterY + 3);
        ctx.fillStyle = '#00e5ff';
        ctx.fillText('TATR', potCenterX - 3, potCenterY - 3);

        // Multi-stop Specular Chrome Gradient
        const chromeGrad = ctx.createLinearGradient(0, potCenterY - 35, 0, potCenterY + 35);
        chromeGrad.addColorStop(0.0, '#ffffff');
        chromeGrad.addColorStop(0.48, '#e0f7fa');
        chromeGrad.addColorStop(0.50, '#001a33');
        chromeGrad.addColorStop(0.53, '#ffea00');
        chromeGrad.addColorStop(0.80, '#ff6f00');
        chromeGrad.addColorStop(1.0, '#311b92');

        ctx.fillStyle = chromeGrad;
        ctx.fillText('TATR', potCenterX, potCenterY);

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3.5;
        ctx.strokeText('TATR', potCenterX, potCenterY);

        // --- SUBTITLE & TAGLINE ---
        ctx.font = 'bold 20px Consolas, Courier, monospace';
        ctx.fillStyle = '#ffea00';
        ctx.shadowColor = '#ffea00';
        ctx.shadowBlur = 10;
        ctx.fillText('POTATO FARMING SIMULATOR', potCenterX, potCenterY + 80);
        ctx.shadowBlur = 0;

        // User Subtitle: "✦ HUID collisions abound ✦"
        const pulse = 0.65 + 0.35 * Math.sin(this.titleAnim * 0.08);
        ctx.font = 'bold 15px Consolas, Courier, monospace';
        ctx.fillStyle = `rgba(0, 229, 255, ${pulse.toFixed(2)})`;
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 8;
        ctx.fillText('✦ HUID collisions abound ✦', potCenterX, potCenterY + 104);
        ctx.shadowBlur = 0;

        // --- INSTRUCTIONS & PROTOCOLS PANEL ---
        const panelX = 90;
        const panelY = 252;
        const panelW = 820;
        const panelH = 278;

        ctx.fillStyle = 'rgba(4, 14, 8, 0.94)';
        ctx.fillRect(panelX, panelY, panelW, panelH);
        ctx.strokeStyle = '#1b7a2b';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(panelX, panelY, panelW, panelH);

        // Corner accents
        ctx.fillStyle = '#00ff66';
        ctx.fillRect(panelX - 2, panelY - 2, 5, 5);
        ctx.fillRect(panelX + panelW - 3, panelY - 2, 5, 5);
        ctx.fillRect(panelX - 2, panelY + panelH - 3, 5, 5);
        ctx.fillRect(panelX + panelW - 3, panelY + panelH - 3, 5, 5);

        // Panel Header Bar
        ctx.fillStyle = '#082612';
        ctx.fillRect(panelX, panelY, panelW, 30);
        ctx.strokeStyle = '#00ff66';
        ctx.lineWidth = 1;
        ctx.strokeRect(panelX, panelY, panelW, 30);

        ctx.font = 'bold 12px Consolas, Courier, monospace';
        ctx.fillStyle = '#00ff66';
        ctx.fillText('⚡ TATR TERMINAL OPERATING MANUAL & HARVEST PROTOCOLS ⚡', potCenterX, panelY + 20);

        // Protocol Entries
        const manualRows = [
          { key: '[ Y ] APPROVE', color: '#00ff66', desc: 'Approve safe code tasks. Mash during the same second to forge HUID COLLISION JACKPOTS!' },
          { key: '[ N ] REJECT ', color: '#ff4455', desc: 'Defuse dangerous [TRAP] lines. Approving a trap causes CATASTROPHIC wipe of your score!' },
          { key: '[ P ] PAUSE  ', color: '#00e5ff', desc: 'Freeze execution anytime for tea. Any key press or screen click immediately unpauses.' },
          { key: '[ Q ] TITLE  ', color: '#ffb300', desc: 'End current run, bank score into Top 10 Hall of Fame, and return to this title screen.' },
          { key: '[ H ] TOP 10 ', color: '#a78bfa', desc: 'Inspect local Hall of Fame records, peak collision rates, and copy bragging snippet.' },
          { key: '🥔 POTATOES  ', color: '#ffca28', desc: 'Field-worker lemmings excavate golden potatoes, bag them into burlap sacks, and deliver to silos!' }
        ];

        let rowY = panelY + 54;
        ctx.textAlign = 'left';
        for (const row of manualRows) {
          ctx.font = 'bold 12px Consolas, Courier, monospace';
          ctx.fillStyle = row.color;
          ctx.fillText(row.key, panelX + 24, rowY);

          ctx.font = '12px Consolas, Courier, monospace';
          ctx.fillStyle = '#cccccc';
          ctx.fillText('—  ' + row.desc, panelX + 138, rowY);
          rowY += 26;
        }

        // Pro Tip Footer
        ctx.font = 'italic 11px Consolas, Courier, monospace';
        ctx.fillStyle = '#88bb88';
        ctx.textAlign = 'center';
        ctx.fillText('PRO TIP: Consecutive second collisions rapidly compound multiplier up to 10.0x! Zero out bloat!', potCenterX, panelY + panelH - 14);

        // --- BLINKING START GAME ACTION PROMPT ---
        const startGlow = 0.5 + 0.5 * Math.sin(this.titleAnim * 0.1);
        const btnBoxX = 220;
        const btnBoxY = 544;
        const btnBoxW = 560;
        const btnBoxH = 46;

        ctx.fillStyle = `rgba(0, 255, 102, ${0.12 + 0.08 * startGlow})`;
        ctx.fillRect(btnBoxX, btnBoxY, btnBoxW, btnBoxH);
        ctx.strokeStyle = `rgba(0, 255, 102, ${0.45 + 0.55 * startGlow})`;
        ctx.lineWidth = 2;
        ctx.strokeRect(btnBoxX, btnBoxY, btnBoxW, btnBoxH);

        ctx.font = 'bold 17px Consolas, Courier, monospace';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00ff66';
        ctx.shadowBlur = 12 * startGlow;
        ctx.fillText('▶  PRESS SPACE / ENTER / [ Y ] OR CLICK TO START  ◀', potCenterX, btnBoxY + 28);
        ctx.shadowBlur = 0;

        // --- LEFT & RIGHT UNDERGROUND TERRARIUM SILO HATCHES ---
        for (const sx of [118, 882]) {
          ctx.fillStyle = 'rgba(38, 22, 6, 0.92)';
          ctx.strokeStyle = '#ffca28';
          ctx.lineWidth = 1.8;
          ctx.fillRect(sx - 78, 544, 156, 46);
          ctx.strokeRect(sx - 78, 544, 156, 46);

          ctx.font = 'bold 11px Consolas, Courier, monospace';
          ctx.fillStyle = '#ffea00';
          ctx.fillText('🥔 [T] SPUD TERRARIUM', sx, 563);
          ctx.font = '10px Consolas, Courier, monospace';
          ctx.fillStyle = '#00e5ff';
          ctx.fillText('▼ DIVE DOWN SILO ▼', sx, 580);
        }

        ctx.restore();
      }

      drawButtons(ctx) {
        ctx.save();
        for (const btn of this.buttons) {
          // Chassis background
          ctx.fillStyle = btn.bg;
          ctx.fillRect(btn.x, btn.y, btn.w, btn.h);

          // Subtle cyber border
          ctx.strokeStyle = btn.border;
          ctx.lineWidth = 1.5;
          ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);

          // Keycap badge box on the left
          const badgeX = btn.x + 3;
          const badgeY = btn.y + 3;
          const badgeW = 38;
          const badgeH = 20;

          ctx.fillStyle = btn.badgeBg;
          ctx.fillRect(badgeX, badgeY, badgeW, badgeH);
          ctx.strokeStyle = btn.actColor;
          ctx.lineWidth = 1;
          ctx.strokeRect(badgeX, badgeY, badgeW, badgeH);

          // Key binding text inside badge, e.g. [ Y ], [ P ]
          ctx.font = 'bold 10px Consolas, Courier, monospace';
          ctx.fillStyle = btn.keyColor;
          ctx.fillText(btn.key, badgeX + 3, badgeY + 14);

          // Action label text
          let actionText = btn.label;
          if (btn.id === 'btn_yes' && this.viewMode === 'title') {
            actionText = 'START';
          } else if (btn.id === 'btn_pause') {
            actionText = this.isPaused ? 'RESUME' : 'PAUSE';
          } else if (btn.id === 'btn_mute') {
            actionText = this.sound.muted ? 'AUDIO: OFF' : 'AUDIO: ON';
          }
          ctx.font = 'bold 11px Consolas, Courier, monospace';
          ctx.fillStyle = btn.actColor;
          ctx.fillText(actionText, btn.x + 46, btn.y + 17);
        }
        ctx.restore();
      }

      drawHallOfFame(ctx) {
        ctx.fillStyle = 'rgba(2, 10, 2, 0.96)';
        ctx.fillRect(40, 60, 920, 520);
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 2;
        ctx.strokeRect(40, 60, 920, 520);

        ctx.font = 'bold 22px Consolas, Courier, monospace';
        ctx.fillStyle = '#00e5ff';
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 8;
        ctx.fillText('★ LOCAL HALL OF FAME - TOP 10 TSODING COLLIDERS ★', 70, 110);
        ctx.shadowBlur = 0;

        ctx.font = 'bold 14px Consolas, Courier, monospace';
        ctx.fillStyle = '#88ff88';
        ctx.fillText('RANK   SCORE         PEAK RATE     TOTAL COLL.   DATE (UTC)', 70, 160);
        ctx.strokeStyle = '#1b7a2b';
        ctx.beginPath();
        ctx.moveTo(70, 172);
        ctx.lineTo(920, 172);
        ctx.stroke();

        let rowY = 205;
        if (this.scoresList.length === 0) {
          ctx.fillStyle = '#888888';
          ctx.fillText('No scores recorded yet. Mash [Y] to generate high-speed collisions!', 70, rowY);
        } else {
          this.scoresList.forEach((item, idx) => {
            ctx.fillStyle = (idx === 0) ? '#ffea00' : (idx < 3 ? '#ffffff' : '#33ff55');
            const rStr = ('#' + (idx + 1)).padEnd(6, ' ');
            const sStr = item.score.toLocaleString().padEnd(14, ' ');
            const rateStr = (item.peakRate + '/s').padEnd(14, ' ');
            const cStr = String(item.collisions).padEnd(14, ' ');
            const dStr = item.date || '2026-10-11';
            ctx.fillText(rStr + ' ' + sStr + ' ' + rateStr + ' ' + cStr + ' ' + dStr, 70, rowY);
            rowY += 28;
          });
        }

        ctx.font = 'bold 15px Consolas, Courier, monospace';
        ctx.fillStyle = '#ffea00';
        ctx.fillText('PRESS [H] OR [TAB] TO RETURN  |  PRESS [C] TO COPY BRAGGING SNIPPET', 70, 540);
      }

      drawScanlines(ctx) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
        for (let y = 0; y < 680; y += 4) {
          ctx.fillRect(0, y, 1000, 2);
        }
      }

      loop(timestamp) {
        const dt = Math.min((timestamp - this.lastFrameTime) / 1000, 0.1);
        this.lastFrameTime = timestamp;

        this.update(dt);
        this.draw();

        requestAnimationFrame((t) => this.loop(t));
      }
    }

    window.addEventListener('load', () => {
      new TerminalGame();
    });
  </script>
</body>
</html>
